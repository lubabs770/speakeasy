<!doctype html>
<html class="staticrypt-html" lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Speakeasy</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="dark" />
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="pragma" content="no-cache" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
        <style>
            :root{color-scheme:dark; --bg:#08090a; --card:#0f1011; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.13);
              --t1:#f7f8f8; --t3:#8a8f98; --t4:#62666d; --accent:#5e6ad2; --red:#eb5757}
            *{box-sizing:border-box}
            html,body{height:100%; margin:0}
            body{background:var(--bg) radial-gradient(800px 380px at 50% -80px,rgba(94,106,210,.2),transparent 70%) no-repeat;
              color:var(--t1); font:400 14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif; -webkit-font-smoothing:antialiased}
            .hidden{display:none!important}
            .staticrypt-spinner-container,.staticrypt-content{min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px 16px}
            .staticrypt-spinner{width:22px; height:22px; border-radius:50%; border:2px solid rgba(255,255,255,.12); border-top-color:var(--accent); animation:spin .7s linear infinite}
            @keyframes spin{to{transform:rotate(360deg)}}
            .staticrypt-form{width:100%; max-width:360px; padding:32px 28px 26px; border-radius:14px; background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012)) var(--card);
              border:1px solid var(--line); box-shadow:0 0 0 1px rgba(0,0,0,.5),0 24px 64px -16px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.05)}
            .shake{animation:shake .35s}
            @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
            .logo{width:40px; height:40px; margin:0 auto 18px; border-radius:11px; display:grid; place-items:center;
              background:linear-gradient(135deg,#7c85f0,#5e6ad2 55%,#3e46a8); box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 24px -6px rgba(94,106,210,.6)}
            .staticrypt-title{margin:0; text-align:center; font-size:20px; font-weight:600; letter-spacing:-.02em}
            .staticrypt-instructions p:last-child{margin:4px 0 22px; text-align:center; color:var(--t3); font-size:13.5px}
            .staticrypt-password-container{position:relative; margin-bottom:12px}
            #staticrypt-password{width:100%; height:40px; padding:0 40px 0 12px; border-radius:8px; border:1px solid var(--line-2); background:#0a0b0c;
              color:var(--t1); font:inherit; font-size:16px; outline:0; transition:border-color .12s,box-shadow .12s}
            #staticrypt-password::placeholder{color:var(--t4)}
            #staticrypt-password:focus{border-color:rgba(124,133,240,.55); box-shadow:0 0 0 3px rgba(94,106,210,.22)}
            .staticrypt-toggle-password-visibility{position:absolute; right:10px; top:50%; transform:translateY(-50%); width:18px; height:18px; cursor:pointer;
              filter:invert(1); opacity:.4}
            .staticrypt-toggle-password-visibility:hover{opacity:.75}
            label.staticrypt-remember{display:flex; align-items:center; gap:9px; margin:4px 0 16px; color:var(--t3); font-size:13px; cursor:pointer; user-select:none}
            .staticrypt-remember input{appearance:none; -webkit-appearance:none; margin:0; width:16px; height:16px; border-radius:4px; border:1px solid var(--line-2); background:#0a0b0c; display:grid; place-items:center; cursor:pointer}
            .staticrypt-remember input:checked{background:var(--accent); border-color:var(--accent)}
            .staticrypt-remember input:checked::after{content:""; width:8px; height:4px; border:solid #fff; border-width:0 0 1.6px 1.6px; transform:rotate(-45deg) translate(1px,-1px)}
            .staticrypt-decrypt-button{width:100%; height:40px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:500; font-size:14px;
              cursor:pointer; box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 1px 2px rgba(0,0,0,.4); transition:background .12s}
            .staticrypt-decrypt-button:hover{background:#6b76e0}
            :focus-visible{outline:2px solid #7c85f0; outline-offset:2px}
            .error{min-height:20px; margin:12px 0 0; text-align:center; color:var(--red); font-size:13px}
        </style>
    </head>
